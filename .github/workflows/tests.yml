# Runs the automated tests on every push to main (and on pull requests): the tracker's rules
# (tests/tracking.test.mjs) and the database access rules against every migration
# (tests/access-rules.test.mjs). A red cross on a commit means a check failed; open the run to see which.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test
